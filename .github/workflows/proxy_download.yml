name: Proxy Download

# ============================================================================
#  给一个下载链接，在 runner 上拉下来 → 存进 artifacts →（可选）发成 Release
#  资产 → 汇总里同时给出「直连」和「代理前缀」两种下载链接
# ============================================================================
#
#  §0  这个 workflow 解决什么问题
#  ---------------------------------------------------------------------------
#  有些第三方二进制只能从境外源取（GitHub release 资产域名在大陆直连会卡死），
#  而仓库里那些要预置二进制的步骤需要一个可复现的「取件」入口：
#  在 runner（境外出口，直连没问题）把文件拉下来，再给你一个**可以贴到本机
#  浏览器/curl 里、并且能套 ghfast 之类代理前缀**的链接。
#
#  ★ 关键事实（决定了产物怎么给）：
#    - **artifacts 的下载链接是鉴权的**。`https://github.com/<repo>/actions/
#      runs/<id>/artifacts/<aid>` 匿名访问会跳登录页，前缀代理拿不到你的
#      cookie ⇒ 给 artifact 链接套代理前缀是**无效**的。
#    - 能套代理前缀的只有**公开**链接，即 Release 资产：
#        https://github.com/<repo>/releases/download/<tag>/<file>
#    所以本 workflow 默认 `publish_release: true`：文件既进 artifacts（留档 /
#    内部用），也发成 Release 资产（拿到可代理的公开链接）。不想发就把这个
#    开关关掉，此时汇总里只会有「需登录」的 artifact 链接。
#
#  §1  代理前缀怎么填（proxy_prefixes）
#  ---------------------------------------------------------------------------
#  逗号或空白分隔的**前缀列表**，只用于**渲染下载链接**，不参与取件
#  （取件是 runner 直连，境外出口不需要代理）。每个前缀渲染一行：
#
#    proxy_prefixes                    渲染出的链接
#    --------------------------------  -----------------------------------
#    (留空)                            只给直连
#    https://ghfast.top/               https://ghfast.top/<公开链接>
#    https://ghfast.top/,https://gh-proxy.com/
#                                     两个前缀各渲染一行，按需挑一个用
#
#  * 前缀末尾的 `/` 可省略，会自动补上。
#  * 前缀只做**字符串拼接** ⇒ 代理必须支持 `<前缀><完整URL>` 这种形式
#    （ghfast.top / gh-proxy.com 都是）。
#  * 只对**公开**链接生效（Release 资产）。artifact 链接那几行会显式标注
#    「需登录，代理无效」，别在那边浪费前缀。
#
#  §2  成功判据（防止把错误页当产物）
#  ---------------------------------------------------------------------------
#    * curl 必须 `-f`（HTTP >= 400 直接失败）且 `-L`（跟随重定向）。
#    * 落盘文件必须非空。
#    * 内容嗅探：开头 512 字节像 HTML（`<!DOCTYPE html` / `<html`）而目标
#      文件名不是 .html/.htm ⇒ 判失败。源站限流、被墙、鉴权页都是
#      **200 + HTML**，光看状态码发现不了 —— 这条断言就是拦这种「假成功」。
#    * 可选 sha256 校验（sha256 输入非空时生效，不匹配直接失败）。
#
#  §3  产物
#  ---------------------------------------------------------------------------
#    artifacts 里固定三个文件：
#      <文件名>          —— 下载到的原始内容，名字取自 URL 末段
#                           （`%xx` 会解码；为空则 download.bin；
#                            也可用 filename 输入覆盖）。
#                           ⚠ 非 `[A-Za-z0-9._-]` 的字符会被替换成 `_`，
#                           中文名/带空格的名字请直接用 filename 指定。
#      <文件名>.sha256   —— 校验行（`<hash>  <文件名>`，可直接 sha256sum -c）
#      manifest.txt      —— url / http 状态 / 字节数 / 类型 / sha256 / 时间
#    job summary 里另有「直连 + 各代理前缀」的链接表，可直接复制。
#    job outputs：artifact_url / release_url / proxied_release_url。
#
#  §4  注意
#  ---------------------------------------------------------------------------
#    * 不 checkout 仓库：本 workflow 与代码无关，省一次 clone。
#      ⚠ 代价是**没有 .git**，而 `gh` 默认靠 `git remote` 推断仓库 ⇒ 会报
#      `failed to run git: fatal: not a git repository`（2026-10-31 实测）。
#      所以发布那一步必须显式给 `GH_REPO`，别删。
#    * 链接一律经 env 传进 shell，不直接插值 —— URL 里的 `&`、`$`、引号
#      拼进命令行会被 shell 解释（注入 + 截断两种坑）。
#    * 发 Release 用 `contents: write`；tag 留空则自动生成
#      `dl-<UTC 时间戳>`，不会撞已有 tag。
#    * 发布那一步 `continue-on-error`：artifacts 已经传好了，发不成 Release
#      也别把整个 job 弄红（但会在那一步打黄标 + 日志，别忽略）。
#    * 单次下载上限 1 小时（curl --max-time 3600），job 上限 60 分钟。

on:
  workflow_dispatch:
    inputs:
      url:
        description: >-
          要下载的链接。例如
          https://github.com/owner/repo/releases/download/v1.0/x.tar.gz
        required: true
        type: string
      proxy_prefixes:
        description: >-
          代理前缀，逗号/空白分隔，只用于渲染下载链接（不参与取件）。
          留空 = 只给直连。详见文件头 §1。
        required: false
        default: "https://ghfast.top/"
        type: string
      publish_release:
        description: >-
          是否把文件发成 Release 资产（拿到可套代理前缀的公开链接）。
          关掉则只有需登录的 artifact 链接。
        required: false
        default: true
        type: boolean
      release_tag:
        description: Release tag。留空 = 自动 `dl-<UTC 时间戳>`。
        required: false
        default: ""
        type: string
      filename:
        description: 产物文件名（含扩展名）。留空取 URL 末段；取不到用 download.bin。
        required: false
        default: ""
        type: string
      sha256:
        description: 期望的 sha256（留空跳过校验）
        required: false
        default: ""
        type: string
      artifact_name:
        description: >-
          artifacts 名字。留空 = download-<文件名去扩展名>。
          同一 run 内 artifact 名不能重复。
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  download:
    name: fetch ${{ inputs.filename || inputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_url: ${{ steps.links.outputs.artifact_url }}
      release_url: ${{ steps.links.outputs.release_url }}
      proxied_release_url: ${{ steps.links.outputs.proxied_release_url }}
    steps:
      - name: Resolve target filename
        id: prep
        env:
          URL: ${{ inputs.url }}
          FILENAME: ${{ inputs.filename }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          # url 是 required，但 workflow 被复用/手改时仍可能为空，先挡住。
          if [ -z "${URL// }" ]; then
            echo "::error::url is empty"
            exit 1
          fi

          name="$FILENAME"
          if [ -z "${name// }" ]; then
            # URL 末段当文件名：query/fragment 交给 urlparse 切掉，再 %xx 解码。
            # 用 python3 而不是 bash 参数展开 —— 编码文件名（%20、%E4%B8%AD）
            # 直接落盘会变成一串 %，python 一行就干净。
            name=$(python3 -c 'import os,sys,urllib.parse as u; print(os.path.basename(u.unquote(u.urlparse(sys.argv[1]).path)))' "$URL")
          fi
          # 只留安全字符：避免 `..`、`/`、空格把文件写出 artifacts 目录。
          # 代价是非 ASCII 名会被替换成 `_`（中文名请用 filename 输入覆盖）。
          name=$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '_' | sed -e 's/^[._]*//' -e 's/__*/_/g')
          if [ -z "$name" ]; then name="download.bin"; fi

          aname="$ARTIFACT_NAME"
          if [ -z "${aname// }" ]; then
            aname=$(printf 'download-%s' "${name%%.*}" | tr -c 'A-Za-z0-9._-' '_')
          fi

          echo "::notice::filename=$name artifact=$aname"
          {
            echo "filename=$name"
            echo "artifact_name=$aname"
          } >> "$GITHUB_OUTPUT"

      - name: Download
        id: fetch
        env:
          URL: ${{ inputs.url }}
          NAME: ${{ steps.prep.outputs.filename }}
          EXPECTED: ${{ inputs.sha256 }}
          WORK: ${{ runner.temp }}/dl
        run: |
          set -euo pipefail
          # 可选输入在 dispatch 不填时 GitHub 会传空串，但本地复跑可能整个
          # 变量都不存在 —— set -u 下这会直接 unbound variable 炸掉，先兜住。
          EXPECTED="${EXPECTED:-}"

          mkdir -p "$WORK"
          out="$WORK/$NAME"

          # --retry-all-errors：429/5xx 也重试（源站限流常回 429）。
          # -w 写到 stdout 供解析；stderr 单独落文件，失败时回显尾巴。
          echo "GET $URL"
          if ! wout=$(curl -fL \
                --retry 3 --retry-all-errors --retry-delay 2 \
                --connect-timeout 15 --max-time 3600 \
                -o "$out.part" \
                -w '%{http_code}\t%{size_download}\t%{url_effective}' \
                "$URL" 2>"$WORK/curl.err"); then
            echo "::error::download failed"
            tail -5 "$WORK/curl.err" || true
            exit 1
          fi
          IFS=$'\t' read -r http _ eff <<<"$wout"

          size=$(stat -c %s "$out.part" 2>/dev/null || echo 0)
          echo "http=$http bytes=$size effective=$eff"
          if [ "$size" -le 0 ]; then
            echo "::error::empty body"
            exit 1
          fi

          # 内容嗅探：200 + HTML 错误页是最常见的「假成功」。
          # 目标本来就是 .html/.htm 时跳过（那时 HTML 是正常产物）。
          case "$NAME" in
            *.html|*.htm|*.HTML|*.HTM) ;;
            *)
              if head -c 512 "$out.part" | grep -qiE '<!doctype html|<html'; then
                echo "::error::got an HTML page, not the file (blocked / rate-limited / login wall?)"
                head -c 200 "$out.part" | tr -d '\0' || true
                echo
                exit 1
              fi
              ;;
          esac

          mv "$out.part" "$out"

          # ---- 可选 sha256 校验 ----
          if [ -n "${EXPECTED// }" ]; then
            actual=$(sha256sum "$out" | cut -d' ' -f1)
            if [ "$actual" != "${EXPECTED,,}" ]; then
              echo "::error::sha256 mismatch"
              echo "expected: ${EXPECTED,,}"
              echo "actual  : $actual"
              exit 1
            fi
            echo "::notice::sha256 verified: $actual"
          fi

          {
            echo "http=$http"
            echo "effective_url=$eff"
            echo "size=$size"
          } >> "$GITHUB_OUTPUT"

      - name: Collect artifacts
        env:
          NAME: ${{ steps.prep.outputs.filename }}
          WORK: ${{ runner.temp }}/dl
          URL: ${{ inputs.url }}
          HTTP: ${{ steps.fetch.outputs.http }}
          EFFECTIVE: ${{ steps.fetch.outputs.effective_url }}
        run: |
          set -euo pipefail
          # 拷到独立目录再上传：artifacts 里只放要交付的东西，
          # 免得 .part / curl.err 这类中间文件被一并收走。
          mkdir -p "$WORK/artifacts"
          cp "$WORK/$NAME" "$WORK/artifacts/$NAME"
          cd "$WORK/artifacts"

          sha256sum "$NAME" > "$NAME.sha256"
          hash=$(cut -d' ' -f1 "$NAME.sha256")
          size=$(stat -c %s "$NAME")
          mime=$(file -b --mime-type "$NAME" || echo unknown)
          desc=$(file -b "$NAME" || true)

          {
            echo "url: $URL"
            echo "effective_url: $EFFECTIVE"
            echo "http: $HTTP"
            echo "file: $NAME"
            echo "size: $size"
            echo "mime: $mime"
            echo "type: $desc"
            echo "sha256: $hash"
            echo "runner: $RUNNER_OS $RUNNER_ARCH"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > manifest.txt

          cat manifest.txt
          ls -l

      # 与仓库其余 workflow 用同一个 pin（renovate 统一升级）。
      - name: Upload workflow artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.prep.outputs.artifact_name }}
          path: ${{ runner.temp }}/dl/artifacts/*
          if-no-files-found: error

      - name: Publish Release asset
        id: release
        if: inputs.publish_release
        # 发不成也把 run 留住：artifacts 已经上传好了，别让整个 job 红掉。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ★ 本 workflow 不 checkout（与代码无关），而 gh 默认靠 `git remote`
          #   推断仓库 ⇒ 在无 .git 的目录里会报
          #   `failed to run git: fatal: not a git repository`（2026-10-31 实测）。
          #   显式给 GH_REPO 后 gh 完全不需要 git。
          GH_REPO: ${{ github.repository }}
          NAME: ${{ steps.prep.outputs.filename }}
          WORK: ${{ runner.temp }}/dl
          TAG: ${{ inputs.release_tag }}
          URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          tag="${TAG// }"
          if [ -z "$tag" ]; then
            # 时间戳 tag：唯一、不覆盖任何已有 release，也不需要清理。
            tag="dl-$(date -u +%Y%m%d-%H%M%S)"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists, adding asset"
          else
            gh release create "$tag" \
              --title "download relay $tag" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --notes "$(printf '取件中转产物。\n\n- 源链接: %s\n- 文件: %s\n- 由 %s 生成\n\n资产下载链接可套代理前缀，例：`https://ghfast.top/<资产URL>`。' \
                  "$URL" "$NAME" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          fi

          # 顺带把校验文件一起挂上去，别人拿到资产能自己验。
          gh release upload "$tag" "$WORK/$NAME" "$WORK/artifacts/$NAME.sha256" --clobber
          echo "::notice::released $tag: $NAME ($(stat -c %s "$WORK/$NAME") B)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Render download links
        id: links
        env:
          NAME: ${{ steps.prep.outputs.filename }}
          TAG: ${{ steps.release.outputs.tag }}
          PROXY_PREFIXES: ${{ inputs.proxy_prefixes }}
        run: |
          set -euo pipefail
          PROXY_PREFIXES="${PROXY_PREFIXES:-}"

          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          # artifact 是鉴权链接，给 run 页面而不是拼 artifact zip URL：
          # 反正要登录，让人在页面上点更可靠（也免得依赖动作的 output 名）。
          artifact_url="${repo_url}/actions/runs/${GITHUB_RUN_ID}"

          # release 资产链接：文件名要 URL 编码（空格、中文等）。
          release_url=""
          if [ -n "${TAG:-}" ]; then
            enc=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$NAME")
            release_url="${repo_url}/releases/download/${TAG}/${enc}"
          fi

          # 前缀列表 → 数组（逗号/空白分隔），末尾斜杠补齐。
          prefixes=()
          for p in ${PROXY_PREFIXES//,/ }; do
            case "$p" in
              */) ;;
              *) p="$p/" ;;
            esac
            prefixes+=("$p")
          done

          # 渲染一行「直连」+ 每个前缀一行。
          rows() {  # $1=标签 $2=url
            echo "| $1 | \`$2\` |"
            for p in "${prefixes[@]}"; do
              echo "| $1 · $p | \`${p}${2}\` |"
            done
          }

          {
            echo "### Proxy Download"
            echo
            echo "| 用途 | 链接 |"
            echo "|---|---|"
            if [ -n "$release_url" ]; then
              # ★ 只有这一组能套代理前缀：公开、无需登录。
              rows "Release 资产" "$release_url"
            else
              echo "| Release 资产 | 未发布（publish_release=false，或发布失败 —— 看上面那步日志） |"
            fi
            # artifact 是鉴权链接，不渲染代理前缀 —— 套上去只会得到登录页。
            echo "| artifacts 下载页（⚠ 需登录） | \`$artifact_url\` |"
            echo
            if [ -n "$release_url" ] && [ ${#prefixes[@]} -gt 0 ]; then
              echo "> 上面 **Release 资产 · <前缀>** 那几行就是套好代理前缀的公开链接，"
              echo "> 直接贴浏览器/curl 即可；artifacts 那行需要 GitHub 登录，代理无效。"
            elif [ -n "$release_url" ]; then
              echo "> 未配置 proxy_prefixes，只给了直连链接。"
            else
              echo "> 未发布 Release：artifacts 链接需 GitHub 登录，无法套代理前缀。"
              echo "> 想拿到可代理的公开链接，请把 publish_release 打开。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          first_prefix="${prefixes[0]:-}"
          {
            echo "artifact_url=$artifact_url"
            echo "release_url=$release_url"
            # 没有前缀时留空，别把直连链接伪装成「代理链接」。
            echo "proxied_release_url=${first_prefix:+${first_prefix}${release_url}}"
          } >> "$GITHUB_OUTPUT"
