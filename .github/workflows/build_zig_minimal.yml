name: Zig Minimal Build (aarch64 + x86_64)

# ============================================================================
#  产 Zig 版 **aarch64 + x86_64** 两个架构的静态裸二进制
#  —— 从 build_sqfs.yml 改造而来；2026-10-20 起**不再产 squashfs**
# ============================================================================
#
#  ★ 为什么不再要 sqfs：设备侧 2026-10-19 起已改成「裸二进制持久部署」
#    （/opt/armbian/bin/openlist/openlist，systemd 之外由 openlist_start.sh 拉起），
#    Go 时代的 /opt/sq 挂载点已 rmdir、镜像已删。再打 sqfs 只是多一层
#    需要挂载的东西，没有任何消费方。
#
#  产物矩阵（固定双架构）：
#
#    arch      target                 Release 资产名
#    aarch64   aarch64-linux-musl     openlist-zig.aarch64_<ver>_<drv>
#    x86_64    x86_64-linux-musl      openlist-zig.x86_64_<ver>_<drv>
#
#  ★ 单测只在 aarch64 那一腿上跑一次（`zig build test` 在 runner 原生执行，
#    与目标架构无关），避免白跑两遍 3 分钟。
#
#  与 Go 版（.github/workflows/build_go_minimal.yml）的关系：
#
#    同：都按「编译期白名单 + 全静态 musl」出产物，驱动清单/CDN 语义一致。
#    异：裁剪手段不同。Go 版在构建**前**用 `go build -overlay` 改写
#        `drivers/all.go` 等源码；Zig 版不需要，因为 Zig 的注册表本身就是
#        编译期常量，`-Ddrivers=` 就直接决定谁被编译进去。
#        （Go 版那边仍带一个 build_sqfs job，本文件与它无关。）
#
#  §0  改驱动只看这一节
#  ---------------------------------------------------------------------------
#  改 `drivers` 输入即可。名字可以是 Go 驱动名（写进 config.json 的
#  `Storage.driver`），也可以是 Zig 源文件名（src/drivers/<name>.zig）：
#
#    Local | local                    上海电信智家硬盘 | itvsh
#    WebDav | webdav                  AliyundriveOpen | aliyundrive
#    189Cloud | cloud189              189CloudPC | cloud189pc
#    123Pan | pan123                  Quark / UC | quarkuc（一个文件出两个驱动）
#    115 Cloud | pan115               WoPan | wopan
#    Strm | strm                      迅雷云盘 | thunder（出 Thunder/ThunderExpert/ThunderWeb）
#
#  留空或填 all = 全量。未知名字会在配置阶段直接失败并列全部合法值，
#  不会静默产出缺驱动的二进制。
#
#  ⚠ 与 Go 版的一个重要差别：Zig 版**没有** MySQL/PostgreSQL 裁剪、没有
#    离线下载/ffmpeg/服务端协议裁剪 —— 这个实现里根本没有这些功能点
#    （见 zig-src/docs/STATUS.md §11）。所以那几个输入不存在。
#
#  §1  体积（打包机实测，-O small -fstrip，drivers=all）
#  ---------------------------------------------------------------------------
#    aarch64-linux-musl   1,314,560 B
#    x86_64-linux-musl    1,476,016 B
#  驱动维度的体积边际见 zig-src/docs/STATUS.md §51 / tools/driver_size.py。
#
#  §2  运行时前提（与 Go 版相同）
#  ---------------------------------------------------------------------------
#    * 必须配 cdn：config.json 的 cdn 字段或环境变量 OPENLIST_CDN，
#      且 WebVersion ∈ {"", beta, dev, rolling}。用官方 CDN 地址
#      https://cdn.jsdelivr.net/npm/@openlist-frontend/openlist-frontend@latest/dist
#      （别写 $version —— 它会被替换成 rolling，而 npm 上没有这个 dist-tag）。
#    * **强烈建议同时配 `zig.cdn_fallbacks`**：CDN 是启动强依赖，取不到
#      index.html 二进制直接退出；而 jsdelivr 在大陆网络是间歇性可用的。
#      fallbacks 让启动先逐个试，全失败才退出。推荐一组（均经实测可达）：
#        "zig": { "cdn_fallbacks": [
#          "https://fastly.jsdelivr.net/npm/@openlist-frontend/openlist-frontend@latest/dist",
#          "https://gcore.jsdelivr.net/npm/@openlist-frontend/openlist-frontend@latest/dist",
#          "https://unpkg.com/@openlist-frontend/openlist-frontend@latest/dist"
#        ] }
#      也可写成逗号分隔的字符串。每个候选默认重试 2 次，最多试 8 个候选。
#      内嵌外壳（默认开，本构建内嵌 v4.2.6 外壳）：web_version 钉在同一版本时
#      启动不拉外壳，CDN 全挂也能起（zig.embed_index_html=false 关闭）。此模式
#      下 npmmirror 固定版本 URL 可直接当 cdn 用。
#      不可用（仅指"启动拉取"路径）：
#        - registry.npmmirror.com：**专门拦 .html**（451 + {"error":"blocked"}，
#          不是法律原因，是 CDN 防滥用策略）。.js/.css/VERSION 都是 200，
#          拦的恰好只是外壳拉取要的 index.html。
#        - jsdelivr.pai233.top：402，需付费。
#    * 不要设 dist_dir：设了会去读不存在的前端文件然后 Fatal。
#      更不要把前端副本打进产物 —— 不内嵌前端正是这个构建的前提。
#    * 被裁掉的驱动若 config.json 里还有对应存储，该存储会 init 失败并记
#      error_msg，其余存储照常服务。
#
#  §3  设备侧部署注意
#  ---------------------------------------------------------------------------
#    * 可执行位：产物本来 0755，设备侧启动脚本会先做 [ ! -x ] 检查，别丢。
#    * 静态：必须无 INTERP 段，否则在 musl 目标机起不来（本文件有断言）。
#    * 换二进制流程见 server/armbian/bin/openlist/README.txt：
#      **停之前先数进程**，必须是 1 个且 exe 不带 `(deleted)`。

on:
  # 只保留手动触发：这个产物只服务自己的设备/服务器，没有"每次推送都出"的需要。
  # 想改成跟随推送就照 build_go_minimal.yml 加 branches 列表。
  workflow_dispatch:
    inputs:
      drivers:
        description: >-
          要编译进去的存储驱动，逗号或空格分隔。留空或 all = 全量（12 项）。
          名字可用 Go 驱动名或 Zig 源文件名，可用名单见文件头 §0。
        required: false
        default: ""
      zig_version:
        description: >-
          Zig 版本号。留空取文件里写死的默认值。项目对 0.17.0 是硬下界
          （build.zig.zon 的 minimum_zig_version），不要往低填。
        required: false
        default: "0.17.0"
      cdn:
        description: 前端 CDN 地址（必须配，否则启动 Fatal）
        required: false
        default: "https://cdn.jsdelivr.net/npm/@openlist-frontend/openlist-frontend@latest/dist"

concurrency:
  # 同分支连推两次取消上一次。被取消的运行可能已有残缺 Release，需手动重跑。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  # ★ 2026-10-18 修复：Zig 工程位于 zig-src/ 子目录，build.zig **不在仓库根**。
  #   原先所有 `zig build` 都在 $GITHUB_WORKSPACE 根执行，第一个
  #   "Show build.zig options" 步骤就因找不到 build.zig 而失败 —— 本
  #   workflow 自创建起从未产出过任何镜像。设了 working-directory 后，
  #   各 run 步骤里的相对路径（zig-out/、build/）自然落在 zig-src/ 下。
  run:
    working-directory: zig-src

jobs:
  build:
    name: zig ${{ matrix.arch }} ${{ inputs.zig_version }} drivers=${{ inputs.drivers || '(all)' }}
    runs-on: ubuntu-latest
    strategy:
      # 一个架构失败不要把另一个也取消掉 —— 两个产物互相独立。
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-musl
            arch: aarch64
          - target: x86_64-linux-musl
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          fetch-tags: true

      - uses: benjlevesque/short-sha@dbe07338b37c456ce06d23409b35a56a7815eef4 # v4.0
        id: short-sha

      # ---- 安装 Zig ----
      # 不用 snap：那拿到的是最新 beta，而 build.zig.zon 对 0.17.0 是硬下界。
      # 直接拉官方 tarball，版本显式可控且无需 root。
      - name: Install Zig
        env:
          ZIG_VERSION: ${{ inputs.zig_version }}
        run: |
          set -e
          case "$(uname -m)" in
            x86_64)  ZIG_ARCH=x86_64 ;;
            aarch64) ZIG_ARCH=aarch64 ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
          TARBALL="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}.tar.xz"
          URL="https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}"
          echo "::notice::installing ${URL}"
          mkdir -p "$HOME/.local"
          curl -fsSL "$URL" -o "$TARBALL"
          tar -C "$HOME/.local" -xf "$TARBALL"
          ZIG_DIR="$HOME/.local/zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
          # tarball 解压根目录即 bin 目录（zig 可执行文件就在这一层，无 bin/ 子目录）
          test -x "$ZIG_DIR/zig" || {
            echo "::error::$ZIG_DIR/zig missing after extract (tarball layout changed?)"
            exit 1
          }
          # ★ $GITHUB_PATH 只对**后续步骤**生效，对本步骤的 shell 无效 ——
          #   原先在这里直接跑 `zig version`，必然 command not found（exit 127，
          #   2026-10-19 首次手动 dispatch 实测）。所以必须步骤内再 export 一次。
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          export PATH="$ZIG_DIR:$PATH"
          zig version

      - name: Show build.zig options
        run: |
          set -e
          # 布局漂移守卫：build.zig 不在当前目录就明说，别让 zig 自己报一句
          # 难懂的 "no build.zig found"（2026-10-18 之前正是这个状态）。
          test -f build.zig || { echo "::error::build.zig not found in $PWD (layout drift?)"; exit 1; }
          zig build --help | sed -n '1,40p'

      # ---- 驱动白名单校验 ----
      # 输入是自由文本，先确认它合法，别等编译到一半才炸。
      # build.zig 的 resolveDrivers 对未知名字会打印全部合法值并以 1 退出，
      # 所以这里只需跑一次 `zig build --help`（只做 configure、不编译）。
      # 注意不能加 `-Dhelp`：那不是合法选项，会自己触发一次失败。
      - name: Validate driver whitelist
        env:
          DRIVERS: ${{ inputs.drivers }}
        run: |
          set -e
          if [ -z "${DRIVERS// }" ]; then
            echo "::notice::empty whitelist -> building every driver"
            exit 0
          fi
          if zig build --help -Ddrivers="$DRIVERS" >/tmp/whitelist.log 2>&1; then
            echo "::notice::whitelist accepted: $DRIVERS"
          else
            echo "::error::unknown driver name(s) in: $DRIVERS"
            grep -E 'unknown driver|known drivers' /tmp/whitelist.log || tail -3 /tmp/whitelist.log
            exit 1
          fi

      # ---- 交叉编译 ----
      # musl + 全静态 + -O small + strip。Zig 自带 musl 静态 libc，不需要
      # 额外工具链 —— 这正是 Zig 做 C 交叉编译的优势所在。
      # 目标由矩阵决定（aarch64-linux-musl / x86_64-linux-musl），
      # 产物落在 zig-out/bin/openlist。
      - name: Build (${{ matrix.target }}, static)
        env:
          DRIVERS: ${{ inputs.drivers }}
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          DRV_ARGS=""
          if [ -n "${DRIVERS// }" ]; then DRV_ARGS="-Ddrivers=$DRIVERS"; fi

          zig build -Dtarget="$TARGET" -Doptimize=small $DRV_ARGS
          echo "--- drivers in this build ---"
          zig build size -Dtarget="$TARGET" -Doptimize=small $DRV_ARGS || true
          echo "--- artifact ---"
          ls -l zig-out/bin/openlist
          file zig-out/bin/openlist 2>/dev/null || true
          readelf -h zig-out/bin/openlist | grep -E 'Machine|Type'

      # ---- 静态链接 + 架构断言 ----
      # 与 build_go_minimal.yml 的断言语义一致：真的静态才能塞进光猫单机跑。
      # 额外断言 Machine 与矩阵一致 —— 交叉编译最怕「配置写错但产物照样出来」，
      # 那种错到设备上才炸。
      - name: Verify musl binary is static and ${{ matrix.arch }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          if readelf -l zig-out/bin/openlist | grep -q "Requesting program interpreter"; then
            echo "Dynamic binary detected:"
            readelf -l zig-out/bin/openlist | grep "Requesting program interpreter" || true
            exit 1
          fi
          machine=$(readelf -h zig-out/bin/openlist | sed -n 's/.*Machine:[[:space:]]*//p' | head -1)
          echo "Machine: $machine"
          case "$ARCH:$machine" in
            aarch64:*AArch64*) ;;
            x86_64:*X86-64*) ;;
            *) echo "::error::arch mismatch: matrix=$ARCH but ELF Machine=$machine"; exit 1 ;;
          esac
          echo "::notice::static confirmed (no INTERP) and arch=$ARCH"

      # ---- 单元测试 ----
      # 与构建**同一份白名单**下跑：测过的驱动集必须是编进二进制的那个。
      # 失败不影响最终打包（那已经是编译成功的产物），但会让 job 变黄并留痕。
      # ★ 只在 aarch64 那一腿跑：`zig build test` 在 runner **原生**执行，
      #   与 -Dtarget 无关，两条腿各跑一遍纯属浪费 3 分钟。
      - name: Unit tests (same whitelist)
        if: matrix.arch == 'aarch64'
        continue-on-error: true
        env:
          DRIVERS: ${{ inputs.drivers }}
        run: |
          set -e
          DRV_ARGS=""
          if [ -n "${DRIVERS// }" ]; then DRV_ARGS="-Ddrivers=$DRIVERS"; fi
          zig build test $DRV_ARGS --summary all 2>&1 | tail -30

      # ---- 收集产物 ----
      # 2026-10-20 起**不再打 squashfs**：设备侧已是裸二进制持久部署，
      # /opt/sq 挂载点已 rmdir、镜像已删，sqfs 没有任何消费方。
      # 这里只把 zig-out 的二进制按「架构 + Zig 版本 + 驱动清单」命名后
      # 落到 build/artifacts/，供 upload-artifact 与 Release 共用。
      - name: Collect artifacts
        env:
          ARCH: ${{ matrix.arch }}
          ZIG_VERSION: ${{ inputs.zig_version }}
          DRIVERS: ${{ inputs.drivers }}
        run: |
          set -e
          mkdir -p build/artifacts
          # 可执行位显式钉一次，不依赖 runner 的 umask / 上游行为。
          chmod 755 zig-out/bin/openlist

          drv="${DRIVERS:-all}"
          # 驱动清单是自由文本，资产名里只允许安全字符。
          drv="${drv//[^a-zA-Z0-9._-]/_}"
          raw_name="openlist-zig.${ARCH}_${ZIG_VERSION}_${drv}"

          cp zig-out/bin/openlist "build/artifacts/${raw_name}"
          echo "RAW_NAME=${raw_name}" >> "$GITHUB_ENV"
          echo "--- artifacts ---"
          ls -l build/artifacts
          sha256sum "build/artifacts/${raw_name}"

      # 把两个产物挂到本次 run 上（Release 之外也能直接下载）。
      # ⚠ path 相对**仓库根**，不受 defaults.run.working-directory 影响，
      #   所以这里必须写全 `zig-src/` 前缀。
      - name: Upload workflow artifacts
        # 与仓库其余 workflow 用同一个 pin（renovate 统一升级）。
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openlist-zig-${{ matrix.arch }}
          path: zig-src/build/artifacts/*
          if-no-files-found: error

      - name: Publish to GitHub Release
        # 输入一律经 env 传进来：自由文本直接插值进 shell 有注入风险。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.short-sha.outputs.sha }}
          DRIVERS: ${{ inputs.drivers }}
          ZIG_VERSION: ${{ inputs.zig_version }}
          CDN: ${{ inputs.cdn }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          # 2026-10-20 起不再产 sqfs，tag 也去掉 sqfs 字样（旧 tag 留在历史里，
          # 不影响任何东西；只是新跑出来的 release 用新名字）。
          tag="ci-zig-${SHA}"
          drv="${DRIVERS:-all}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists, adding asset"
          else
            # ⚠ 两条矩阵腿是并行的：可能都看到「不存在」然后同时 create，
            #   其中一个必然失败。这里用 `|| true` 吞掉竞态，下面再确认一次。
            gh release create "$tag" \
              --title "Zig build ${SHA} (aarch64 + x86_64)" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --notes "$(printf 'Zig 版静态裸二进制（白名单驱动 + CDN 前端），双架构。\n\n- commit: %s\n- Zig: %s\n- 驱动: %s\n- 前端 CDN: %s\n\n资产：\n- `openlist-zig.aarch64_*` —— aarch64（光猫那台）\n- `openlist-zig.x86_64_*` —— x86_64（普通服务器）\n\n两者都是静态 musl 单体，无 INTERP 段，拷到目标机 chmod +x 即可运行。\n运行时必须配置 cdn（config.json 的 cdn 字段或环境变量 OPENLIST_CDN），否则启动 Fatal。\n\n注意：\n1. 被裁掉的驱动若 config.json 里还有对应存储，该存储 init 失败，其余照常服务。\n2. 驱动名可用 Go 驱动名（如 189Cloud）或 Zig 源文件名（如 cloud189），见本 workflow 头部 §0。\n\n换二进制流程见 server/armbian/bin/openlist/README.txt（停之前先数进程）。\n构建与裁剪方法论见 .github/workflows/build_zig_minimal.yml 头部，Zig 侧结论见 zig-src/docs/STATUS.md。' \
                "${GITHUB_SHA}" "${ZIG_VERSION}" "${drv}" "${CDN}" || true
          fi
          gh release view "$tag" >/dev/null 2>&1 || {
            echo "::error::release $tag still missing after create"; exit 1; }

          gh release upload "$tag" "build/artifacts/${RAW_NAME}" --clobber
          echo "::notice::released ${tag}: ${RAW_NAME} ($(stat -c %s "build/artifacts/${RAW_NAME}") B) [${ARCH}]"
